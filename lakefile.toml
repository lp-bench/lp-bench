name = "my-mathlib-project"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["ProofBench"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "Matroid"
git = "https://github.com/apnelson1/Matroid.git"
rev = "fa6c155b76ffa93925d3a35188ae24f88f56d053"

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.1"

[[lean_lib]]
name = "ProofBench"
