name: notify website
# After every push to main, signals proof-bench/proof-bench.github.io to regenerate its
# problem list from this repository (its workflow site.yml). Needs the secret
# WEBSITE_DISPATCH_TOKEN: a fine-grained token with Contents read and write access to
# proof-bench/proof-bench.github.io. Without the secret the step is skipped.
on:
  push:
    branches: [main]

jobs:
  notify:
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
    steps:
      - name: Signal the website repository
        if: env.TOKEN != ''
        run: |
          curl --fail --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/proof-bench/proof-bench.github.io/dispatches \
            -d '{"event_type": "proofbench-updated", "client_payload": {"sha": "${{ github.sha }}"}}'
