name: notify website
# After every push to main, signals lp-bench/lp-bench.github.io to regenerate its
# problem list from this repository (its workflow site.yml). The signal is sent with a
# short-lived key of the proof-bench GitHub App whose ID and private key are stored in the
# secrets PROOFBENCH_APP_ID and PROOFBENCH_APP_KEY; without them, the job does nothing.
on:
  push:
    branches: [main]

jobs:
  notify:
    runs-on: ubuntu-latest
    env:
      APP_ID: ${{ secrets.PROOFBENCH_APP_ID }}
    steps:
      - name: Create a key for the website repository
        id: app
        if: env.APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.PROOFBENCH_APP_ID }}
          private-key: ${{ secrets.PROOFBENCH_APP_KEY }}
          owner: lp-bench
          repositories: lp-bench.github.io

      - name: Signal the website repository
        if: env.APP_ID != ''
        env:
          TOKEN: ${{ steps.app.outputs.token }}
        run: |
          curl --fail --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/lp-bench/lp-bench.github.io/dispatches \
            -d '{"event_type": "proofbench-updated", "client_payload": {"sha": "${{ github.sha }}"}}'
